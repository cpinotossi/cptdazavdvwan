name: Deploy vWAN AVD UDR Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

env:
  LOCATION: swedencentral
  PREFIX: cptdazavdvwan
  ADMIN_USERNAME: chpinoto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: az group create --name "rg-${{ env.PREFIX }}" --location "${{ env.LOCATION }}"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "rg-${{ env.PREFIX }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --verbose

      - name: Show deployment operations on failure
        if: failure()
        run: |
          echo "=== Deployment Operations ==="
          az deployment group list \
            --resource-group "rg-${{ env.PREFIX }}" \
            --output table
          echo ""
          echo "=== Failed Operations ==="
          DEPLOY_NAME=$(az deployment group list \
            --resource-group "rg-${{ env.PREFIX }}" \
            --query "[0].name" -o tsv)
          az deployment operation group list \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name "$DEPLOY_NAME" \
            --query "[?properties.provisioningState=='Failed'].{resource:properties.targetResource.resourceName, error:properties.statusMessage.error}" \
            --output json

      - name: Register AVD Session Host
        run: |
          RG="rg-${{ env.PREFIX }}"
          HP="hp-${{ env.PREFIX }}"
          VM="vm-avd-${{ env.PREFIX }}"

          echo "=== Retrieving AVD registration token ==="
          TOKEN=$(az desktopvirtualization hostpool retrieve-registration-token \
            --resource-group "$RG" \
            --name "$HP" \
            --query token -o tsv)

          if [ -z "$TOKEN" ]; then
            echo "Token empty, generating new one..."
            TOKEN=$(az rest --method POST \
              --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${RG}/providers/Microsoft.DesktopVirtualization/hostPools/${HP}/registrationTokens?api-version=2023-09-05" \
              --body '{"expirationTime":"'"$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%S.0000000Z)"'"}' \
              --query token -o tsv)
          fi

          echo "=== Installing DSC extension for AVD agent ==="
          az vm extension set \
            --resource-group "$RG" \
            --vm-name "$VM" \
            --name "DSC" \
            --publisher "Microsoft.Powershell" \
            --version "2.73" \
            --settings "{
              \"modulesUrl\": \"https://wvdportalstorageblob.blob.core.windows.net/galleryartifacts/Configuration_1.0.02797.442.zip\",
              \"configurationFunction\": \"Configuration.ps1\\\\AddSessionHost\",
              \"properties\": {
                \"hostPoolName\": \"${HP}\",
                \"registrationInfoToken\": \"${TOKEN}\",
                \"aadJoin\": true
              }
            }" \
            --verbose

      - name: Show effective routes on AVD NIC
        run: |
          echo "=== Effective Routes on AVD NIC ==="
          echo "Look for:"
          echo "  - 0.0.0.0/0 -> VirtualHub (Routing Intent)"
          echo "  - WindowsVirtualDesktop IPs -> Internet (UDR + NAT GW)"
          echo "  - 10.99.0.0/16 -> None (UDR test)"
          echo ""
          az network nic show-effective-route-table \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name "nic-avd-${{ env.PREFIX }}" \
            --output table

      - name: Show public IPs for comparison
        run: |
          RG="rg-${{ env.PREFIX }}"
          echo "=== Public IPs ==="
          echo "Firewall PIP (default internet egress):"
          az deployment group show -g "$RG" -n main --query properties.outputs.firewallPublicIp.value -o tsv
          echo ""
          echo "NAT Gateway PIP (expected for WVD/RDP traffic):"
          az deployment group show -g "$RG" -n main --query properties.outputs.natGatewayPublicIp.value -o tsv
          echo ""
          echo "=== Test from VM: curl ifconfig.me ==="
          echo "If Routing Intent wins for default traffic, this shows Firewall PIP."
          echo "Run via Bastion/Serial Console: curl -s ifconfig.me"

      - name: Validate routing via Run Command
        run: |
          RG="rg-${{ env.PREFIX }}"
          VM="vm-avd-${{ env.PREFIX }}"
          echo "=== Running outbound IP check on AVD VM ==="
          az vm run-command invoke \
            --resource-group "$RG" \
            --name "$VM" \
            --command-id RunPowerShellScript \
            --scripts "
              Write-Output '--- Outbound IP (general internet) ---'
              try { (Invoke-WebRequest -Uri http://ifconfig.me/ip -UseBasicParsing -TimeoutSec 10).Content } catch { Write-Output \"BLOCKED or timeout: \$_\" }
              Write-Output ''
              Write-Output '--- Effective routes (Get-NetRoute) ---'
              Get-NetRoute -AddressFamily IPv4 | Where-Object { \$_.DestinationPrefix -ne '255.255.255.255/32' -and \$_.DestinationPrefix -ne '224.0.0.0/4' } | Format-Table -AutoSize
            " \
            --output json | jq -r '.value[].message'
