name: Deploy vWAN AVD UDR Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.bicep'
      - '*.bicepparam'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

env:
  LOCATION: swedencentral
  PREFIX: cptdazavdvwan
  ADMIN_USERNAME: chpinoto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: az group create --name "rg-${{ env.PREFIX }}" --location "${{ env.LOCATION }}"

      - name: Deploy Bicep
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          KV_RG: ${{ secrets.KV_RG }}
          KV_NAME: ${{ secrets.KV_NAME }}
        run: |
          az deployment group create \
            --resource-group "rg-${{ env.PREFIX }}" \
            --template-file main.bicep \
            --parameters main.bicepparam

      - name: Show effective routes on AVD NIC
        run: |
          az network nic show-effective-route-table \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name "nic-avd-${{ env.PREFIX }}" \
            --output table
