name: Deploy Group Membership

# Dynamic membership pipeline. Edit infra/identity/members.bicepparam (add/remove object IDs)
# and push, or run manually. The .bicepparam list is the single source of truth: users not
# listed are removed from the group ('replace' semantics in members.bicep).
#
# Decoupled from the AVD/Chaos infrastructure on purpose so frequent access changes have a
# small blast radius and a focused PR/audit trail.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'infra/identity/members.bicep'
      - 'infra/identity/members.bicepparam'
      - 'infra/identity/shared.bicep'
      - 'infra/identity/bicepconfig.json'
      - '.github/workflows/members.yml'

permissions:
  id-token: write
  contents: read

env:
  PREFIX: cptdazavdvwan

jobs:
  members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for security groups to exist
        run: |
          # members.bicep uses 'replace' semantics (PATCH), which requires the groups
          # to already exist (they are created by deploy.yml / infra/identity/main.bicep).
          # On a first push both workflows run in parallel, so wait for the groups here
          # instead of failing with Request_ResourceNotFound.
          for NAME in "grp-avd-users-${{ env.PREFIX }}" "grp-avd-chaos-${{ env.PREFIX }}"; do
            echo "Waiting for group $NAME ..."
            for i in $(seq 1 30); do
              ID=$(az ad group list --filter "uniqueName eq '$NAME'" --query "[0].id" -o tsv)
              if [ -n "$ID" ]; then echo "  found: $ID"; break; fi
              if [ "$i" -eq 30 ]; then
                echo "::error::Group $NAME not found after waiting. Run the AVD deploy (deploy.yml) first."
                exit 1
              fi
              sleep 10
            done
          done

      - name: Deploy group membership
        run: |
          az deployment group create \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name identity-members \
            --template-file infra/identity/members.bicep \
            --parameters infra/identity/members.bicepparam
