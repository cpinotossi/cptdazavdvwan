name: Deploy Chaos Studio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'infra/chaos/**'
      - '.github/workflows/chaos.yml'

permissions:
  id-token: write
  contents: read

env:
  LOCATION: swedencentral
  PREFIX: cptdazavdvwan

jobs:
  deploy-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Chaos resource provider
        run: az provider register --namespace Microsoft.Chaos --wait

      - name: Ensure user-assigned identity and attach to VM
        run: |
          RG="rg-${{ env.PREFIX }}"
          VM="vm-avd-${{ env.PREFIX }}"
          UAMI="id-chaos-${{ env.PREFIX }}"

          echo "=== Create user-assigned managed identity (idempotent) ==="
          az identity create -g "$RG" -n "$UAMI" -l "${{ env.LOCATION }}"
          UAMI_ID=$(az identity show -g "$RG" -n "$UAMI" --query id -o tsv)

          echo "=== Attach UAMI to the session host VM (idempotent) ==="
          az vm identity assign -g "$RG" -n "$VM" --identities "$UAMI_ID"

      - name: Deploy Chaos Studio Bicep
        run: |
          az deployment group create \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name chaos \
            --template-file infra/chaos/main.bicep \
            --parameters infra/chaos/main.bicepparam \
            --verbose

      - name: Show Chaos deployment outputs
        run: |
          echo "=== Chaos experiment ==="
          az deployment group show \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name chaos \
            --query properties.outputs -o json
