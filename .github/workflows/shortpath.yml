name: Deploy RDP Shortpath Session Host

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'infra/shortpath/**'
      - '.github/workflows/shortpath.yml'

permissions:
  id-token: write
  contents: read

env:
  LOCATION: swedencentral
  PREFIX: cptdazavdvwan
  ADMIN_USERNAME: chpinoto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AVD user group
        run: |
          # Reuse the same security group as the primary stack (created by infra/identity).
          AVD_GROUP=$(az ad group list \
            --filter "uniqueName eq 'grp-avd-users-${{ env.PREFIX }}'" \
            --query "[0].id" -o tsv)
          echo "AVD_USER_GROUP_OBJECT_ID=$AVD_GROUP" >> "$GITHUB_ENV"
          echo "Resolved AVD user group: ${AVD_GROUP:-<not found>}"

      - name: Deploy Shortpath Bicep
        run: |
          az deployment group create \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name shortpath \
            --template-file infra/shortpath/main.bicep \
            --parameters infra/shortpath/main.bicepparam \
            --verbose

      - name: Show deployment operations on failure
        if: failure()
        run: |
          echo "=== Failed Operations ==="
          az deployment operation group list \
            --resource-group "rg-${{ env.PREFIX }}" \
            --name shortpath \
            --query "[?properties.provisioningState=='Failed'].{resource:properties.targetResource.resourceName, error:properties.statusMessage.error}" \
            --output json

      - name: Register Shortpath Session Host
        run: |
          RG="rg-${{ env.PREFIX }}"
          HP="hp-shortpath-${{ env.PREFIX }}"
          VM="vm-shortpath-${{ env.PREFIX }}"

          echo "=== Retrieving AVD registration token ==="
          TOKEN=$(az desktopvirtualization hostpool retrieve-registration-token \
            --resource-group "$RG" \
            --name "$HP" \
            --query token -o tsv)

          if [ -z "$TOKEN" ]; then
            echo "Token empty, generating new one..."
            TOKEN=$(az rest --method POST \
              --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${RG}/providers/Microsoft.DesktopVirtualization/hostPools/${HP}/registrationTokens?api-version=2023-09-05" \
              --body '{"expirationTime":"'"$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%S.0000000Z)"'"}' \
              --query token -o tsv)
          fi

          echo "=== Installing DSC extension for AVD agent ==="
          az vm extension set \
            --resource-group "$RG" \
            --vm-name "$VM" \
            --name "DSC" \
            --publisher "Microsoft.Powershell" \
            --version "2.73" \
            --settings "{
              \"modulesUrl\": \"https://wvdportalstorageblob.blob.core.windows.net/galleryartifacts/Configuration_1.0.02797.442.zip\",
              \"configurationFunction\": \"Configuration.ps1\\\\AddSessionHost\",
              \"properties\": {
                \"hostPoolName\": \"${HP}\",
                \"registrationInfoToken\": \"${TOKEN}\",
                \"aadJoin\": true
              }
            }" \
            --verbose

      - name: Verify RDP Shortpath readiness (public networks)
        run: |
          RG="rg-${{ env.PREFIX }}"
          VM="vm-shortpath-${{ env.PREFIX }}"
          # avdnettest.exe is NOT downloaded here: the session host egresses through
          # Azure Firewall with an FQDN allow-list that does not include
          # raw.githubusercontent.com. Final Shortpath verification is client-side
          # (Connection Information dialog) or post-connection via Event ID 135 in
          # Microsoft-Windows-RemoteDesktopServices-RdpCoreCDV/Operational.
          echo "=== Checking RDP transport protocol default on the Shortpath host ==="
          az vm run-command invoke \
            --resource-group "$RG" \
            --name "$VM" \
            --command-id RunPowerShellScript \
            --scripts "
              \$p='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services'
              \$v=Get-ItemProperty -Path \$p -Name fClientDisableUDP,SelectTransport,fUseUdpPortRedirector,UdpPortNumber -ErrorAction SilentlyContinue
              if (\$null -eq \$v -or \$null -eq \$v.fClientDisableUDP) {
                Write-Output 'UDP transport: DEFAULT (enabled). Public-networks Shortpath (STUN/TURN) can be used.'
              } elseif (\$v.fClientDisableUDP -eq 1) {
                Write-Output 'UDP transport: DISABLED by policy (fClientDisableUDP=1). Shortpath will fall back to TCP.'
              } else {
                Write-Output 'UDP transport: enabled (fClientDisableUDP=0).'
              }
              Write-Output ('Managed-networks listener (fUseUdpPortRedirector): ' + \$(if (\$v.fUseUdpPortRedirector) { \$v.fUseUdpPortRedirector } else { 'not set (managed-networks Shortpath off)' }))
            " \
            --output json | jq -r '.value[].message'
